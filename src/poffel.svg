<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pøffel — a Norwegian heart waffle wrapped around a hot dog with ketchup">
  <defs>
    <linearGradient id="pf-waffle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9d066"/>
      <stop offset="1" stop-color="#d7962a"/>
    </linearGradient>
    <linearGradient id="pf-sausage" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a83c22"/>
      <stop offset=".5" stop-color="#d1603c"/>
      <stop offset="1" stop-color="#ec8b64"/>
    </linearGradient>
    <clipPath id="pf-heart">
      <path d="M100 168 C60 138 34 108 34 78 C34 56 50 42 70 42 C84 42 94 50 100 62 C106 50 116 42 130 42 C150 42 166 56 166 78 C166 108 140 138 100 168 Z"/>
    </clipPath>
  </defs>

  <!-- waffle body -->
  <g clip-path="url(#pf-heart)">
    <rect x="28" y="36" width="144" height="138" fill="url(#pf-waffle)"/>
    <!-- recessed waffle grooves -->
    <g stroke="#b9801d" stroke-width="7" opacity=".9" stroke-linecap="round">
      <line x1="56" y1="30" x2="56" y2="176"/>
      <line x1="78" y1="30" x2="78" y2="176"/>
      <line x1="100" y1="30" x2="100" y2="176"/>
      <line x1="122" y1="30" x2="122" y2="176"/>
      <line x1="144" y1="30" x2="144" y2="176"/>
      <line x1="24" y1="64" x2="176" y2="64"/>
      <line x1="24" y1="86" x2="176" y2="86"/>
      <line x1="24" y1="108" x2="176" y2="108"/>
      <line x1="24" y1="130" x2="176" y2="130"/>
      <line x1="24" y1="152" x2="176" y2="152"/>
    </g>
    <!-- baked highlight beside each vertical groove for a 3D look -->
    <g stroke="#ffe8a6" stroke-width="2.5" opacity=".55">
      <line x1="51" y1="30" x2="51" y2="176"/>
      <line x1="73" y1="30" x2="73" y2="176"/>
      <line x1="95" y1="30" x2="95" y2="176"/>
      <line x1="117" y1="30" x2="117" y2="176"/>
      <line x1="139" y1="30" x2="139" y2="176"/>
    </g>
  </g>
  <!-- crisp waffle edge -->
  <path d="M100 168 C60 138 34 108 34 78 C34 56 50 42 70 42 C84 42 94 50 100 62 C106 50 116 42 130 42 C150 42 166 56 166 78 C166 108 140 138 100 168 Z"
        fill="none" stroke="#a26814" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- hot dog sausage: tucked diagonally into the waffle, poking out top-right -->
  <line x1="72" y1="150" x2="158" y2="40" stroke="#7f2f14" stroke-width="35" stroke-linecap="round"/>
  <line x1="72" y1="150" x2="158" y2="40" stroke="url(#pf-sausage)" stroke-width="27" stroke-linecap="round"/>
  <line x1="79" y1="145" x2="151" y2="53" stroke="#f6b590" stroke-width="6" stroke-linecap="round" opacity=".7"/>

  <!-- ketchup drizzle running along the sausage -->
  <path d="M84 141 C99 133 92 120 105 114 C118 108 111 95 124 89 C137 83 130 70 145 63"
        fill="none" stroke="#df2617" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M84 141 C99 133 92 120 105 114 C118 108 111 95 124 89 C137 83 130 70 145 63"
        fill="none" stroke="#ff6552" stroke-width="2.6" stroke-linecap="round" opacity=".6"/>
</svg>
